name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check
        run: npx biome check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # PokeDocs renders mermaid at build time via chromium
      - name: Install chromium for build-time mermaid
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
